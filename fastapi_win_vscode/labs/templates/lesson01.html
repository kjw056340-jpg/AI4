<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 01 - FastAPI 시작하기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 20px;
      font-family: "Malgun Gothic", sans-serif;
      line-height: 1.7;
      color: #17233d;
      background: #f1f5fb;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px;
      border: 1px solid #dce4f0;
      border-radius: 16px;
      background: white;
    }
    h1 { margin-top: 0; color: #365bd6; overflow-wrap: anywhere; }
    a { color: #2846ad; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #7298ff; outline-offset: 4px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input, button { width: 100%; padding: 12px; font: inherit; border-radius: 8px; }
    input { border: 1px solid #9aaac2; margin-bottom: 12px; }
    button { border: none; background: #365bd6; color: white; cursor: pointer; }
    button:hover { background: #2846ad; }
    input:focus-visible, button:focus-visible { outline: 3px solid #7298ff; outline-offset: 3px; }
    .result { padding: 16px; border-radius: 8px; background: #eef4ff; overflow-wrap: anywhere; }
    .error { padding: 16px; border-radius: 8px; background: #fff0f0; color: #a32121; }
  </style>
</head>
<body>
  <main>
    <h1>Hello FastAPI</h1>
    <p>별도 HTML 파일로 만든 첫 번째 FastAPI 화면입니다.</p>
    <p>이름을 입력하면 서버가 인사말을 만들어 보여줍니다.</p>

    <!-- name 속성은 파이썬 함수의 name 매개변수와 연결됩니다. -->
    <form action="/greet" method="get">
      <label for="name">이름</label>
      <input id="name" name="name" type="text" value="{{ name }}"
             placeholder="예: 홍길동" maxlength="30" autocomplete="given-name" required>
      <button type="submit">인사말 만들기</button>
    </form>

    <!-- 서버에서 전달한 값이 있을 때만 표시합니다. -->
    {% if message %}
    <section class="result" aria-labelledby="result-title">
      <h2 id="result-title">서버 처리 결과</h2>
      <p>{{ message }}</p>
    </section>
    {% endif %}

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <p><a href="/">처음으로</a></p>
    <a href="/docs">API 문서 보기</a>
  </main>
</body>
</html>
